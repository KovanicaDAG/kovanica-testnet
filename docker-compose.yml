    volumes:
      - val2-data:/var/lib/kovanica
      - ./ops/docker/validators/val2.pem:/var/lib/kovanica/validator.pem:ro
      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kovanica/genesis_validators.toml:ro
      - ./ops/docker/validators/funded_accounts.toml:/var/lib/kovanica/funded_accounts.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8547/health"]

  val3:
    <<: *node
    container_name: kovanica-testnet-val3
