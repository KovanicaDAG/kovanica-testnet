        condition: service_healthy
    environment:
      <<: *node-env
      KOVANICA_RPC_PORT: "8550"
      KOVANICA_RUN_VALIDATOR: "true"
      KOVANICA_VALIDATOR_KEY: "/var/lib/kovanica/validator.pem"
      KOVANICA_BOOTNODES: "testnet.kovanica.online:8000,seed:8000"
