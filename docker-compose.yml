      - ./ops/docker/validators/genesis_validators.toml:/var/lib/kovanica/genesis_validators.toml:ro
      - ./ops/docker/validators/funded_accounts.toml:/var/lib/kovanica/funded_accounts.toml:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8548/health"]

  val4:
    <<: *node
    container_name: kovanica-testnet-val4
    depends_on:
      seed:
        condition: service_healthy
    environment:
      <<: *node-env
      KOVANICA_RPC_PORT: "8549"
