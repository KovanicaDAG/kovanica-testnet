# Nginx configuration for seed2.kovanica.online (VPS 2: 76.13.250.65)

# Map allowed origins for CORS
map $http_origin $cors_origin {
    default "*";
    "~^https?://.*kovanica\.online$" "$http_origin";
    "~^http://localhost(:[0-9]+)?$" "$http_origin";
    "~^http://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name seed2.kovanica.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS seed2 RPC & Node API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seed2.kovanica.online;

    ssl_certificate /etc/letsencrypt/live/seed2.kovanica.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seed2.kovanica.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Prometheus metrics endpoint
    location = /metrics {
        proxy_pass http://127.0.0.1:8545/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check
    location = /health {
        include /etc/nginx/snippets/kovanica-cors.conf;
        proxy_pass http://127.0.0.1:8545/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # JSON-RPC root and /rpc endpoint
    location / {
        include /etc/nginx/snippets/kovanica-cors.conf;

        # Support POST to / directly
        if ($request_method = POST) {
            rewrite ^/$ /rpc break;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Validator 5 secondary RPC endpoint
    location /val5/ {
        include /etc/nginx/snippets/kovanica-cors.conf;
        rewrite ^/val5/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
