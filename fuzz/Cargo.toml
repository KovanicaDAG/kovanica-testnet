[package]
name = "kovanica-fuzz"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fuzz_block"
path = "fuzz_block.rs"

[[bin]]
name = "fuzz_tx"
path = "fuzz_tx.rs"

[[bin]]
name = "fuzz_vote"
path = "fuzz_vote.rs"

[[bin]]
name = "fuzz_consensus"
path = "fuzz_consensus.rs"

[dependencies]
kovanica-types = { path = "../crates/kovanica-types" }
kovanica-crypto = { path = "../crates/kovanica-crypto" }
kovanica-consensus = { path = "../crates/kovanica-consensus" }
kovanica-mempool = { path = "../crates/kovanica-mempool" }
kovanica-dag = { path = "../crates/kovanica-dag" }
kovanica-storage = { path = "../crates/kovanica-storage" }
kovanica-network = { path = "../crates/kovanica-network" }
anyhow = { workspace = true }
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
bincode = { workspace = true }