# cargo-audit configuration. Every ignore needs a justification and an exit plan.
[advisories]
ignore = [
  # RUSTSEC-2024-0344: timing variability in curve25519-dalek 3.2.0 Scalar sub.
  # Pulled in only via `ecvrf` 0.4.3 (VRF leader election in kovanica-crypto),
  # whose latest release still depends on curve25519-dalek 3.x, so there is no
  # semver-compatible upgrade. Replacing the VRF backend changes consensus-
  # critical cryptography and needs its own reviewed change (already tracked in
  # AUDIT_REPORT.md / AUTOMATED_SECURITY_CHECKS.md). Remove this ignore once
  # the VRF moves to a curve25519-dalek >= 4.1.3 implementation.
  "RUSTSEC-2024-0344",
]
