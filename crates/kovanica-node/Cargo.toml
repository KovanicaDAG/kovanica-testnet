[package]
name = "kovanica-node"
version = "0.0.31"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kovanica-node"
path = "src/main.rs"

[dependencies]
kovanica-types = { path = "../kovanica-types" }
kovanica-crypto = { path = "../kovanica-crypto" }
kovanica-storage = { path = "../kovanica-storage" }
kovanica-dag = { path = "../kovanica-dag" }
kovanica-consensus = { path = "../kovanica-consensus" }
kovanica-network = { path = "../kovanica-network" }
kovanica-mempool = { path = "../kovanica-mempool" }
kovanica-execution = { path = "../kovanica-execution" }
kovanica-staking = { path = "../kovanica-staking" }
kovanica-rpc = { path = "../kovanica-rpc" }
kovanica-runtime = { path = "../kovanica-runtime" }
kovanica-common = { path = "../kovanica-common" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
hex = { workspace = true }
zeroize = "1"
parking_lot = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
libp2p = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
redb = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core", "batch"] }
reqwest = { workspace = true }
