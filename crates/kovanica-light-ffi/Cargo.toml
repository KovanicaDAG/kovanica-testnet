[package]
name = "kovanica-light-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI bindings for the Kovanica light client"

[lib]
name = "kovanica_light_ffi"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
kovanica-types = { path = "../kovanica-types" }
kovanica-crypto = { path = "../kovanica-crypto" }
kovanica-light = { path = "../kovanica-light" }
kovanica-keystore = { path = "../kovanica-keystore" }
kovanica-comms-core = { path = "../kovanica-comms-core" }
kovanica-comms-crypto = { path = "../kovanica-comms-crypto" }
kovanica-comms-relay = { path = "../kovanica-comms-relay", default-features = false }
# §7.2 registry slot: single source of truth for the contract storage key.
# Both are mobile-safe (no std-only / network deps; `kovanica-common` pulls only
# blake3, already in the tree via `kovanica-crypto`).
kovanica-common = { path = "../kovanica-common" }
kovanica-name-registry = { path = "../kovanica-name-registry" }
uniffi = { version = "=0.32.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
zeroize = "1"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "kovanica-light-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
