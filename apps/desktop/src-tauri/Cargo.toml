[package]
name = "kovanica-comms-desktop"
version = "0.1.0"
description = "Kovanica Comms desktop client (Tauri v2 shell)"
authors = ["Kovanica Team"]
edition = "2021"
license = "Apache-2.0"

# This crate is intentionally NOT a member of the repository-root Cargo
# workspace (whose `members` list names crates explicitly). Declaring an empty
# workspace here makes it a standalone Tauri app workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Canonical comms identity (BLAKE3 domain-separated id). Shared byte-for-byte
# with `packages/comms/src/identity.ts` and the `kovanica comms id` CLI harness.
kovanica-comms-core = { path = "../../../crates/kovanica-comms-core" }
