[package]
name = "kovanica-console"
version = "0.1.0"
description = "Kovanica Console desktop app"
authors = ["Kovanica Team"]
edition = "2021"
license = "Apache-2.0"

# Standalone app workspace. The repository root lists its members explicitly,
# and this shell must not join that list.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
url = "2"
thiserror = "1"
zeroize = { version = "1", features = ["serde"] }
bincode = "1.3"
hex = "0.4"
kovanica-keystore = { path = "../../../crates/kovanica-keystore" }
kovanica-light-ffi = { path = "../../../crates/kovanica-light-ffi" }
kovanica-types = { path = "../../../crates/kovanica-types" }

[dev-dependencies]
kovanica-crypto = { path = "../../../crates/kovanica-crypto" }
tauri = { version = "2", features = ["test"] }
